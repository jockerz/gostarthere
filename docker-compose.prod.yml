services:
  traefik:
    env_file: .env
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entryPoints.web.address=:80
      - --entryPoints.websecure.address=:443
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
    restart: always

  postgres:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${HOSTNAME_BACKEND:?Set HOSTNAME_BACKEND in .env}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.routers.backend.middlewares=api-strip"

  worker:
    restart: always
    # env_file: backend/.env
    # environment:
    #   SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in backend/.env}
    #   SMTP_PORT: ${SMTP_PORT:-587}
    #   SMTP_STARTTLS: ${SMTP_STARTTLS:-}
    #   SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in backend/.env}
    #   SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in backend/.env}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${HOSTNAME_FRONTEND:?Set HOSTNAME_FRONTEND in .env}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=redirect-https"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"

volumes:
  traefik-certs:
